name: Napominalka
options:
  bundleIdPrefix: com.magnat
  deploymentTarget:
    iOS: "16.0"
targets:
  Napominalka:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Напоминалка
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSFaceIDUsageDescription: Face ID нужен, чтобы отключать будильник.
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.magnat.napominalka
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: "NO"
    scheme: {}
